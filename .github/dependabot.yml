# Mises à jour automatiques des dépendances : une PR groupée par écosystème,
# chaque lundi, 7 jours après la publication d'une version (délai de sécurité).
# Après une mise à jour Python, régénérer le verrou des builds :
#   python packaging/build.py --lock
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      interface:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
